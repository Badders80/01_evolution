<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyCjJfkdUIoZS-a3soi0MafZ8yfA4K-m8w0",
      authDomain: "evolution-engine.firebaseapp.com",
      projectId: "evolution-engine",
      storageBucket: "evolution-engine.firebasestorage.app",
      messagingSenderId: "851430309148",
      appId: "1:851430309148:web:41dd7c7e2be68539beced9"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    console.log('Firebase initialized');

    // ─── Auth state listener (single source of truth) ──────────────
    auth.onAuthStateChanged((user) => {
      const signInBtn = document.querySelector('button[onclick="signInWithGoogle()"]');
      const signOutBtn = document.getElementById('logout-btn');
      const userInfo   = document.getElementById('user-info');
      const userEmail  = document.getElementById('user-email');

      if (user) {
        if (signInBtn) signInBtn.classList.add('hidden');
        if (signOutBtn) signOutBtn.classList.remove('hidden');
        if (userInfo) {
          userInfo.classList.remove('hidden');
          if (userEmail) userEmail.textContent = user.email;
        }
        // Trigger app.js render if available
        if (typeof window.render === 'function') window.render();
      } else {
        if (signInBtn) signInBtn.classList.remove('hidden');
        if (signOutBtn) signOutBtn.classList.add('hidden');
        if (userInfo)  userInfo.classList.add('hidden');
      }
    });

    // ─── Global auth functions (accessible via onclick) ────────────
    async function signInWithGoogle() {
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await auth.signInWithPopup(provider);
      } catch (error) {
        console.error('Login error:', error);
        alert('Sign-in failed: ' + error.message);
      }
    }

    async function signOut() {
      try {
        await auth.signOut();
      } catch (error) {
        console.error('Logout error:', error);
      }
    }

    // ─── Auth header helper for API calls ──────────────────────────
    window.getAuthHeader = async () => {
      const user = firebase.auth().currentUser;
      if (user) {
        const token = await user.getIdToken();
        return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
      }
      return { 'Content-Type': 'application/json' };
    };
  </script>
  <style>
    :root {
      --font-body: 'IBM Plex Sans', sans-serif;

    .nav-item {

    .nav-section-label {

    .label { @apply text-xs font-medium text-slate-500 uppercase tracking-wider; }

    .tag { @apply text-xs text-slate-400 font-mono; }

    a.breeding-url { @apply text-blue-600 hover:underline text-sm; }

    /* Form styles matching old build */
    .form-input { @apply w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500/20; }
    .form-input-sm { @apply w-full rounded-md border border-slate-300 px-3 py-2 text-sm; }
    .form-label { @apply block text-sm font-medium text-slate-700 mb-1; }
    .form-label-sm { @apply mb-1 block text-xs font-medium text-slate-600; }
    .section-card { @apply rounded-xl border border-slate-200 bg-slate-50 p-4; }
    .section-title { @apply text-xs font-semibold uppercase tracking-[0.14em] text-slate-500; }

    /* Modal styles */
    .modal-overlay { @apply fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/60 p-4; }
    .modal-content { @apply max-h-[85vh] w-full max-w-3xl overflow-y-auto rounded-xl border border-slate-200 bg-white p-6; }

    /* Button styles */
    .btn-primary { @apply inline-flex items-center gap-1.5 rounded-md bg-blue-600 px-3 py-1.5 text-sm font-semibold text-white hover:bg-blue-700; }
    .btn-secondary { @apply inline-flex items-center gap-1.5 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-semibold text-slate-700 hover:bg-slate-50; }
    .btn-ghost { @apply inline-flex items-center gap-1.5 rounded-md border border-rose-200 bg-rose-50 px-3 py-1.5 text-sm font-semibold text-rose-700 hover:bg-rose-100; }
    .btn-success { @apply inline-flex items-center gap-1.5 rounded-md border border-emerald-200 bg-emerald-50 px-3 py-1.5 text-xs font-semibold text-emerald-700 hover:bg-emerald-100; }

    /* Step indicator */
    .step-dot { @apply flex h-7 w-7 items-center justify-center rounded-full text-xs font-semibold; }
    .step-dot.active { @apply bg-blue-600 text-white; }
    .step-dot.inactive { @apply bg-slate-200 text-slate-600; }
    .step-line { @apply h-1 flex-1 rounded; }
    .step-line.complete { @apply bg-blue-500; }
    .step-line.pending { @apply bg-slate-200; }

    /* Full-screen wizard step indicators */
    .step-dot-large { @apply flex h-12 w-12 items-center justify-center rounded-xl text-white shadow-lg transition-all duration-300; }
    .step-dot-large.active { @apply bg-gradient-to-br from-blue-600 to-indigo-600 shadow-blue-500/30 scale-110; }
    .step-dot-large:not(.active) { @apply bg-slate-200 text-slate-400; }
    .progress-line { @apply h-0.5 w-16 mx-4 transition-all duration-300; }
    .progress-line.complete { @apply bg-gradient-to-r from-blue-500 to-indigo-500; }
    .progress-line:not(.complete) { @apply bg-slate-200; }

    /* Pricing engine highlight */
    .pricing-engine { @apply rounded-xl border-2 border-blue-100 bg-blue-50/30 p-5; }

    /* Table styles */
    .table-header { @apply bg-slate-50 text-left text-xs uppercase tracking-[0.12em] text-slate-500; }
    .table-cell { @apply px-5 py-3; }
    .table-row { @apply cursor-pointer border-t border-slate-100 hover:bg-slate-50/70; }

    /* Expandable row */
    .expand-content { @apply border-b border-slate-100 bg-slate-50; }
    .expand-inner { @apply flex flex-col gap-2 p-4 pl-14; }
    .doc-card { @apply flex items-center justify-between rounded-lg border border-slate-200 bg-white p-3; }
    .doc-header { @apply flex items-center gap-3; }
    .doc-actions { @apply flex items-center gap-3; }
    .doc-btn { @apply text-xs font-semibold hover:underline; }
    .doc-btn-primary { @apply text-blue-700; }
    .doc-btn-secondary { @apply text-slate-500; }
    .doc-btn-muted { @apply text-slate-400; }

    /* Edit form in expanded row */
    .edit-form { @apply rounded-lg border border-blue-200 bg-blue-50/50 p-4; }
    .edit-grid { @apply grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3; }
    .edit-field { @apply block text-sm; }

    /* Toast/notification */
    .toast { @apply fixed bottom-6 right-6 z-[70] rounded-xl border bg-white p-4 shadow-xl animate-slide-in; }
    .toast-success { @apply border-emerald-200 text-emerald-800; }
    .toast-error { @apply border-rose-200 text-rose-800; }
    .toast-info { @apply border-blue-200 text-blue-800; }

    @keyframes slide-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-slide-in { animation: slide-in 0.3s ease-out; }
  </style>
</head>
